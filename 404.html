<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#173b2c">
  <title>Сторінку не знайдено — Доми біля Києва</title>
  <style>
    :root{--forest:#173b2c;--ink:#17231d;--muted:#6b746e;--line:#dfe3df;--paper:#f6f5f1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:48px;box-shadow:0 20px 60px rgba(23,59,44,.08)}
    .brand{color:var(--forest);font:700 22px Georgia,serif;text-decoration:none}.code{margin:42px 0 8px;color:#87948b;font:700 15px/1 sans-serif;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font:700 clamp(38px,8vw,66px)/1 Georgia,serif;letter-spacing:-.045em}p{max-width:520px;color:var(--muted);font-size:17px;line-height:1.6}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.actions a{border:1px solid var(--line);border-radius:10px;padding:12px 18px;color:var(--forest);font-weight:800;text-decoration:none}
    .actions a:first-child{background:var(--forest);border-color:var(--forest);color:#fff}@media(max-width:560px){main{padding:30px 22px;border-radius:18px}.actions{display:grid}.actions a{text-align:center}}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="./">⌂ Доми біля Києва</a>
    <p class="code">Помилка 404</p>
    <h1>Цієї сторінки немає</h1>
    <p>Посилання могло застаріти, або сторінку було переміщено. Поверніться до каталогу чи відкрийте особистий кабінет.</p>
    <div class="actions">
      <a href="./">До каталогу</a>
      <a href="./cabinet.html">Особистий кабінет</a>
    </div>
  </main>
</body>
</html>
