<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Об’єкт — Заміська</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f0e8;color:#172019;font-family:Arial,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}img{display:block;width:100%;object-fit:cover}.wrap{max-width:1240px;margin:auto;padding:0 28px}header{position:sticky;top:0;z-index:20;background:rgba(243,240,232,.95);border-bottom:1px solid #c9c4b8}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font:700 25px Georgia}.logo b{color:#a6523a}.links{display:flex;gap:28px}.menu{display:none;border:0;background:none;font-size:25px}.btn{display:inline-flex;padding:13px 20px;background:#1e271f;color:#fff;border:1px solid #1e271f;cursor:pointer}.btn.alt{background:#a6523a;border-color:#a6523a}.section{padding:75px 0}.muted{color:#697168}.footer{padding:45px 0;background:#1e271f;color:#ddd}.gallery{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:260px 260px;gap:7px}.gallery img{height:100%}.gallery .main{grid-row:1/3}.detail{display:grid;grid-template-columns:1.5fr .8fr;gap:55px;padding:45px 0 80px}.detail h1{font:500 45px Georgia;margin:0}.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #bbb;border-left:1px solid #bbb;margin-top:30px}.fact{padding:18px;border-right:1px solid #bbb;border-bottom:1px solid #bbb}.fact b{display:block;font:500 25px Georgia;margin-top:7px}.card{background:#1e271f;color:#fff;padding:28px;position:sticky;top:95px}.card input{width:100%;padding:13px;margin:7px 0 12px}.notice{font-size:13px;color:#c8c8c8}.source{display:inline-block;margin-top:20px;text-decoration:underline}@media(max-width:800px){.links{display:none;position:absolute;top:72px;left:0;right:0;background:#f3f0e8;padding:20px 28px;flex-direction:column}.links.open{display:flex}.menu{display:block}.detail{grid-template-columns:1fr}.gallery{grid-template-columns:1fr;grid-template-rows:300px}.gallery>*:not(.main){display:none}.gallery .main{grid-row:auto}.facts{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><div class="wrap nav"><a class="logo" href="index.html">Заміська<b>.</b></a><nav class="links" id="nav"><a href="index.html#catalog">Каталог</a><a href="index.html#about">Про сервіс</a><a href="index.html#contact">Контакти</a></nav><button class="menu" id="menu" aria-label="Меню">☰</button></div></header><main id="app"></main><footer class="footer"><div class="wrap">© 2026 Заміська</div></footer><script src="data.js"></script><script>const id=new URLSearchParams(location.search).get('id'),x=PROPERTIES.find(p=>p.slug===id)||PROPERTIES[0],money=n=>'$'+Number(n).toLocaleString('en-US');document.title=x.title+' — Заміська';document.querySelector('#app').innerHTML=`<div class="wrap" style="padding-top:22px"><a class="muted" href="index.html#catalog">← Назад до каталогу</a></div><section class="section" style="padding-top:24px"><div class="wrap"><div class="gallery"><div class="main"><img src="${x.photos[0]}" alt="${x.title}"></div><div><img src="${x.photos[1]||x.photos[0]}" alt="Фото об’єкта"></div><div><img src="${x.photos[2]||x.photos[0]}" alt="Фото об’єкта"></div></div><div class="detail"><article><p class="muted">${x.location} · ${x.kind}</p><h1>${x.title}</h1><div class="facts"><div class="fact">Площа<b>${x.area} м²</b></div><div class="fact">Ділянка<b>${x.land?x.land+' сот.':'уточнюється'}</b></div><div class="fact">Спальні<b>${x.beds||'—'}</b></div><div class="fact">Ціна<b>${money(x.price)}</b></div></div><h2 style="font:500 30px Georgia;margin-top:45px">Про об’єкт</h2><p>${x.description}</p><a class="source" href="${x.source}" target="_blank" rel="noopener">Відкрити першоджерело ↗</a></article><aside><div class="card"><h2 style="font:500 28px Georgia;margin-top:0">Запросити перегляд</h2><p>Залиште контакт — форма перевіряє обов’язкові поля і показує статус відправлення.</p><form id="request"><input required placeholder="Ваше ім’я"><input required type="tel" placeholder="Телефон"><button class="btn alt" style="width:100%">Надіслати</button><p class="notice" id="msg">Ваші дані не публікуються.</p></form></div></aside></div></div></section>`;document.querySelector('#request').onsubmit=e=>{e.preventDefault();document.querySelector('#msg').textContent='Запит прийнято у демонстраційному режимі.';e.target.reset()};document.querySelector('#menu').onclick=()=>document.querySelector('#nav').classList.toggle('open');</script></body></html>
