<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b2c"><title>Заявки — Доми біля Києва</title><style>:root{--g:#173b2c;--p:#f5f4ef;--l:#dfe3dd;--m:#68736c}*{box-sizing:border-box}body{margin:0;background:var(--p);color:#17231d;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:64px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1180px)/2))}a{color:inherit;text-decoration:none}.brand{font:700 22px Georgia,serif}.back{color:var(--g);font-weight:700}main{width:min(1180px,calc(100% - 28px));margin:32px auto 70px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:850;color:#71806e;margin:0 0 8px}h1,h2{font-family:Georgia,serif;letter-spacing:-.025em}h1{font-size:clamp(34px,5vw,56px);margin:0}h2{margin:0 0 14px;font-size:27px}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:18px;padding:24px;box-shadow:0 10px 35px rgba(25,45,33,.06)}label{display:grid;gap:6px;margin:12px 0;font-size:11px;text-transform:uppercase;font-weight:800;color:var(--m)}input,select,textarea{width:100%;border:1px solid var(--l);border-radius:10px;background:#fff;padding:0 12px;font:inherit}input,select{height:46px}textarea{min-height:100px;padding-top:12px;resize:vertical}button{height:44px;border:0;border-radius:10px;background:var(--g);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.secondary{background:#fff;color:var(--g);border:1px solid #9ca99f}.status{min-height:22px;color:var(--m)}.success{color:#26713c}.error{color:#a13b35}.auth{display:flex;gap:8px}.auth input{flex:1}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}.list{display:grid;gap:10px}.lead{border:1px solid var(--l);border-radius:13px;padding:14px;background:#fbfbf8}.lead-head{display:flex;justify-content:space-between;gap:10px}.lead h3{font-size:16px;margin:0 0 4px}.lead p{margin:5px 0;color:var(--m);font-size:13px}.contact{display:flex;gap:10px;flex-wrap:wrap}.contact a{color:var(--g);font-weight:800}.lead select{height:36px;width:auto;margin-top:10px}.badge{display:inline-flex;padding:4px 8px;border-radius:99px;background:#e7efe8;color:var(--g);font-size:10px;font-weight:850}.empty{padding:24px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:12px}.role{font-size:12px;color:var(--m)}[hidden]{display:none!important}@media(max-width:760px){header{padding:0 14px}.brand{font-size:18px}main{margin-top:20px}.hero{display:block}.grid{grid-template-columns:1fr}.panel{padding:18px}.auth{display:grid}.lead-head{display:block}.lead select{width:100%}}</style><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://vtnucevhyhfvymppjbfa.supabase.co','sb_publishable_-5iiF1Qgq--BKgXLHREINA_nPC7yVVY',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),labels={new:'Нова',contacted:'Зв’язались',viewing:'Перегляд',negotiation:'Переговори',won:'Успішно',lost:'Втрачено'};let role='guest';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function units(){const{data,error}=await s.from('site_units').select('id,title,location_name,address').order('created_at',{ascending:false}).limit(500);if(error){$('formStatus').textContent=error.message;return}$('unit').innerHTML='<option value="">Оберіть об’єкт</option>'+(data||[]).map(x=>`<option value="${x.id}">${esc(x.title||'Будинок')} — ${esc(x.location_name||x.address||'')}</option>`).join('');const q=new URLSearchParams(location.search).get('unit');if(q)$('unit').value=q}async function submit(e){e.preventDefault();const b=$('send'),st=$('formStatus');b.disabled=true;st.className='status';st.textContent='Надсилання…';const{data,error}=await s.rpc('submit_property_lead',{p_unit_id:$('unit').value,p_customer_name:$('name').value.trim(),p_phone:$('phone').value.trim()||null,p_email:$('leadEmail').value.trim()||null,p_message:$('message').value.trim()||null});b.disabled=false;st.className='status '+(error?'error':'success');st.textContent=error?error.message:(data?.assigned?'Заявку надіслано продавцю.':'Заявку прийнято. Адміністратор призначить відповідального.');if(!error)e.target.reset()}function card(x,admin=false){return`<article class="lead" data-id="${x.id}"><div class="lead-head"><div><h3>${esc(x.customer_name)}</h3><p>${esc(x.unit_title||'Об’єкт')} · ${esc(x.location_name||'')}</p></div><span class="badge">${labels[x.status]||x.status}</span></div><div class="contact">${x.phone?`<a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:''}${x.email?`<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:''}</div>${x.message?`<p>${esc(x.message)}</p>`:''}<p>${new Date(x.created_at).toLocaleString('uk-UA')}</p><select data-status>${Object.entries(labels).map(([k,v])=>`<option value="${k}"${k===x.status?' selected':''}>${v}</option>`).join('')}</select>${admin&&!x.assigned_seller_user_id?'<p class="error">Не призначено продавця</p>':''}</article>`}async function loadInbox(){const box=$('leadList');box.innerHTML='';let data,error;if(role==='admin')({data,error}=await s.rpc('admin_all_leads'));else({data,error}=await s.rpc('seller_my_leads'));if(error){box.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}box.innerHTML=(data||[]).length?(data||[]).map(x=>card(x,role==='admin')).join(''):'<div class="empty">Нових заявок поки немає.</div>';box.querySelectorAll('[data-status]').forEach(sel=>sel.onchange=async()=>{sel.disabled=true;const id=sel.closest('.lead').dataset.id,fn=role==='admin'?'admin_update_lead_status':'seller_update_lead_status';const{error}=await s.rpc(fn,{p_lead_id:id,p_status:sel.value});sel.disabled=false;if(error)alert(error.message);else loadInbox()})}async function session(){const{data:{session}}=await s.auth.getSession();$('loginBox').hidden=!!session;$('workspace').hidden=!session;if(!session){role='guest';return}const{data:profile}=await s.rpc('ensure_user_profile');role=profile?.role||'customer';try{const{data}=await s.rpc('admin_all_leads');if(data)role='admin'}catch{}$('role').textContent=role==='admin'?'Адміністратор':role==='seller'?'Продавець':'Покупець';$('workspaceTitle').textContent=role==='admin'?'Усі заявки CRM':'Вхідні заявки продавця';await loadInbox()}$('leadForm').onsubmit=submit;$('login').onsubmit=async e=>{e.preventDefault();const{error}=await s.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.href}});$('loginStatus').className='status '+(error?'error':'success');$('loginStatus').textContent=error?error.message:'Посилання надіслано.'};$('logout').onclick=()=>s.auth.signOut();$('refresh').onclick=loadInbox;s.auth.onAuthStateChange(session);units();session();</script></head><body><header><a class="brand" href="./">⌂ Доми біля Києва</a><a class="back" href="./">До каталогу</a></header><main><div class="hero"><div><p class="eyebrow">Заявки та CRM</p><h1>Зв’язок із продавцем</h1></div><p class="role" id="role">Гість</p></div><div class="grid"><section class="panel"><p class="eyebrow">Покупець</p><h2>Запитати про об’єкт</h2><form id="leadForm"><label>Об’єкт<select id="unit" required></select></label><label>Ім’я<input id="name" required minlength="2" autocomplete="name"></label><label>Телефон<input id="phone" type="tel" autocomplete="tel"></label><label>Email<input id="leadEmail" type="email" autocomplete="email"></label><label>Повідомлення<textarea id="message" placeholder="Хочу уточнити ціну, стан ремонту або домовитися про перегляд"></textarea></label><button id="send">Надіслати заявку</button><p class="status" id="formStatus"></p></form></section><section class="panel"><div id="loginBox"><p class="eyebrow">Продавець / адміністратор</p><h2>Увійти до вхідних заявок</h2><form id="login" class="auth"><input id="email" type="email" required placeholder="you@example.com"><button>Надіслати посилання</button></form><p class="status" id="loginStatus"></p></div><div id="workspace" hidden><div class="toolbar"><div><p class="eyebrow">CRM</p><h2 id="workspaceTitle">Вхідні заявки</h2></div><div><button id="refresh" class="secondary">Оновити</button> <button id="logout" class="secondary">Вийти</button></div></div><div class="list" id="leadList"></div></div></section></div></main></body></html>
